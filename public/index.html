<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equatorial Auto Invoice — Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Equatorial Auto Invoice — Monitor</h1>
            <div class="header-actions">
                <button id="btn-run" class="btn-primary">Iniciar agora</button>
                <div class="status-badge" id="service-status">OFFLINE</div>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Status do serviço</h2>
                <div class="stat-group">
                    <div class="stat-item">
                        <span class="label">Última execução</span>
                        <span class="value" id="last-run">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Próxima execução</span>
                        <span class="value" id="next-run">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Última atividade</span>
                        <span class="value highlight" id="last-activity">-</span>
                    </div>
                    <div class="stat-item config-item">
                        <label for="interval-input" class="label">Intervalo (horas)</label>
                        <div class="input-group">
                            <input type="number" id="interval-input" min="1" max="168" value="24" />
                            <button id="btn-save-config" class="btn-secondary">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Estatísticas do ciclo</h2>
                <div class="stats-grid">
                    <div class="stat-box success">
                        <span class="stat-number" id="stat-success">0</span>
                        <span class="stat-label">Sucesso</span>
                    </div>
                    <div class="stat-box error">
                        <span class="stat-number" id="stat-fail">0</span>
                        <span class="stat-label">Falhas</span>
                    </div>
                    <div class="stat-box warning">
                        <span class="stat-number" id="stat-no-invoice">0</span>
                        <span class="stat-label">Sem fatura</span>
                    </div>
                    <div class="stat-box neutral">
                        <span class="stat-number" id="stat-total">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card logs-card">
            <div class="card-header">
                <h2>Logs do sistema</h2>
                <span class="log-status">Ao vivo</span>
            </div>
            <div class="terminal" id="terminal-logs">
                <div class="log-line">Carregando logs...</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
