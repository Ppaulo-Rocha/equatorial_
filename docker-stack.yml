version: '3.8'

services:
  equatorial-bot:
    # Substitua a imagem abaixo pela sua (Docker Hub/Registry), se necessário.
    image: paulolimal/equatorial:latest
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
      # Recomendado configurar via secrets/variáveis do swarm:
      # - AUTH_TOKEN=...
      # - WEBHOOK_CONTAS_URL=...
      # - WEBHOOK_ENVIO_URL=...
      # - EMAIL_DEFAULT=...
      # - SENHA_DEFAULT=...
    ports:
      - "2031:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - bot-net

networks:
  bot-net:
    driver: overlay

