version: '3.8'

services:
  equatorial-bot:
    build: .
    image: equatorial-bot:latest
    container_name: equatorial-bot
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "2031:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

