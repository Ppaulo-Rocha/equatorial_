version: '3.8'

services:
  equatorial-bot:
    build: .
    image: equatorial-bot:latest
    container_name: equatorial-bot
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - AUTH_TOKEN=057ebcdc28b0b95cabe45341b209d28d
    ports:
      - "2031:3000"
    restart: unless-stopped
    # Resource limits to ensure it runs smoothly on limited hardware
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
